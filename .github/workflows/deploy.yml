name: Deploy to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd ~/servime
          git pull origin main
          composer install --no-dev --optimize-autoloader
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart
          # Copiar archivos de public/ a public_html/
          cp -r ~/servime/public/* ~/domains/servime.net/public_html/
          # Crear symlink de storage si no existe
          if [ ! -L ~/domains/servime.net/public_html/storage ]; then
            ln -sf ~/servime/storage/app/public ~/domains/servime.net/public_html/storage
          fi

